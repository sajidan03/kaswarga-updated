[phases.setup]
nixPkgs = ["php83", "nodejs_20", "php83Packages.composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader", "npm install"]

[phases.build]
cmds = ["npm run build", "php artisan config:cache || true", "php artisan route:cache || true", "php artisan view:cache || true"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"